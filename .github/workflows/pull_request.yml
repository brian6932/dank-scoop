name: Pull Requests

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  pullRequestHandler:
    name: PullRequestHandler
    if: github.event_name == 'pull_request' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/verify'))
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: PullRequestHandler
        uses: ScoopInstaller/GithubActions@main
        env:
          SCOOP_REPO: "https://github.com/brian6932/Scoop"
          SCOOP_BRANCH: "64bit-v2-v3-v4"
